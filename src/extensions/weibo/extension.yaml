id: weibo
name: 微博下载器
version: 1.0.0
description: 微博/秒拍视频下载，支持长视频/短视频/合集/用户主页批量
author: OpenFetch Team
platforms:
  - video
apis:
  - method: download
    description: 下载单个视频
    params:
      - name: url
        type: string
        required: true
        description: 微博视频URL
  - method: user
    description: 下载用户主页视频
    params:
      - name: uid
        type: string
        required: true
        description: 用户UID
      - name: limit
        type: integer
        required: false
        default: 20
        description: 下载数量
ai_capable: true
auto_describe: "微博视频下载专家，支持微博、秒拍视频下载"
