id: live
name: 直播下载器
version: 1.0.0
description: 多平台直播录制，支持B站/抖音/斗鱼/虎牙/Twitch/YouTube Gaming等
author: OpenFetch Team
platforms:
  - live
apis:
  - method: record
    description: 录制直播
    params:
      - name: url
        type: string
        required: true
        description: 直播间URL
      - name: output
        type: string
        required: false
        default: "./downloads/live"
        description: 输出目录
      - name: quality
        type: string
        required: false
        default: "best"
        description: 画质(best/high/medium/low)
  - method: schedule
    description: 定时录制
    params:
      - name: url
        type: string
        required: true
        description: 直播间URL
      - name: start_time
        type: string
        required: true
        description: 开始时间(ISO格式)
      - name: duration
        type: integer
        required: false
        description: 录制时长(秒)
ai_capable: true
auto_describe: "直播录制专家，支持全平台直播间录制，实时监控开播状态"
