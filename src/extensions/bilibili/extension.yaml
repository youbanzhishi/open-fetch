id: bilibili
name: Bilibili下载器
version: 1.0.0
description: B站视频/番剧/直播/漫画全能下载，支持AV/BV号、SS/EP号、UP主批量下载
author: OpenFetch Team
platforms:
  - video
  - live
  - comic
apis:
  - method: download
    description: 下载B站视频
    params:
      - name: url
        type: string
        required: true
        description: B站视频URL、AV号或BV号
      - name: quality
        type: string
        required: false
        default: "最高画质"
        description: 画质选择(1080P/720P/480P/最高画质)
      - name: format
        type: string
        required: false
        default: "mp4"
        description: 输出格式(mp4/mkv/flv)
  - method: batch
    description: 批量下载
    params:
      - name: uid
        type: string
        required: true
        description: UP主UID
      - name: limit
        type: integer
        required: false
        default: 10
        description: 下载数量限制
  - method: subtitle
    description: 下载字幕
    params:
      - name: url
        type: string
        required: true
        description: 视频URL
      - name: languages
        type: array
        required: false
        default: ["zh-CN", "zh-TW", "en"]
        description: 字幕语言
ai_capable: true
auto_describe: "我是一名B站下载专家，能下载任意B站视频、番剧、电影、直播和漫画，支持弹幕、字幕、封面和封面组下载"
