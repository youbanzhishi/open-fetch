id: compress
name: 音视频压缩器
version: 1.0.0
description: FFmpeg-powered音视频压缩，支持批量、转码、格式转换、分辨率调整
author: OpenFetch Team
platforms:
  - tool
apis:
  - method: compress
    description: 压缩视频
    params:
      - name: input
        type: string
        required: true
        description: 输入文件路径
      - name: output
        type: string
        required: false
        description: 输出文件路径
      - name: crf
        type: integer
        required: false
        default: 23
        description: 质量值(0-51，越低越高)
      - name: preset
        type: string
        required: false
        default: "medium"
        description: 编码速度(ultrafast/superfast/veryfast/faster/fast/medium/slow/slower/veryslow)
      - name: format
        type: string
        required: false
        description: 输出格式(mp4/mkv/avi/webm)
  - method: compress_audio
    description: 压缩音频
    params:
      - name: input
        type: string
        required: true
        description: 输入文件路径
      - name: output
        type: string
        required: false
        description: 输出文件路径
      - name: bitrate
        type: string
        required: false
        default: "192k"
        description: 音频比特率(128k/192k/256k/320k)
  - method: batch
    description: 批量压缩
    params:
      - name: inputs
        type: array
        required: true
        description: 输入文件列表
      - name: output_dir
        type: string
        required: false
        default: "./compressed"
        description: 输出目录
ai_capable: true
auto_describe: "音视频压缩专家，使用FFmpeg实现高质量压缩，支持批量处理和格式转换"
