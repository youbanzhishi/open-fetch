<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务列表 - OpenFetch Cloud</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --bg-light: #1e293b;
            --bg-card: #334155;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { margin-bottom: 20px; }
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        select, input {
            padding: 8px 12px;
            background: var(--bg-card);
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text);
        }
        .task-table {
            width: 100%;
            background: var(--bg-light);
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--bg-card);
        }
        th { background: var(--bg-card); font-weight: 500; }
        tr:hover { background: var(--bg-card); }
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .pending { background: #3b82f6; }
        .downloading { background: var(--warning); color: black; }
        .completed { background: var(--success); }
        .failed { background: var(--error); }
        .actions { display: flex; gap: 8px; }
        .btn {
            padding: 4px 10px;
            background: var(--bg-card);
            border: none;
            border-radius: 4px;
            color: var(--text-dim);
            cursor: pointer;
        }
        .btn:hover { color: var(--text); }
        .empty { text-align: center; padding: 60px; color: var(--text-dim); }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 任务列表</h1>
        <div class="filter-bar">
            <select id="statusFilter">
                <option value="">全部状态</option>
                <option value="pending">等待中</option>
                <option value="downloading">下载中</option>
                <option value="completed">已完成</option>
                <option value="failed">失败</option>
            </select>
            <input type="text" id="searchInput" placeholder="搜索URL...">
            <button class="btn" onclick="loadTasks()">🔄 刷新</button>
        </div>
        <div class="task-table">
            <table>
                <thead>
                    <tr>
                        <th>平台</th>
                        <th>URL</th>
                        <th>进度</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="taskBody">
                    <tr><td colspan="6" class="empty">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        let allTasks = [];
        
        document.addEventListener('DOMContentLoaded', loadTasks);
        document.getElementById('statusFilter').addEventListener('change', filterTasks);
        document.getElementById('searchInput').addEventListener('input', filterTasks);
        
        async function loadTasks() {
            const res = await fetch('/api/tasks');
            const data = await res.json();
            allTasks = data.success ? data.data : [];
            filterTasks();
        }
        
        function filterTasks() {
            const status = document.getElementById('statusFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allTasks.filter(t => {
                if (status && t.status !== status) return false;
                if (search && !t.url.toLowerCase().includes(search)) return false;
                return true;
            });
            
            renderTasks(filtered);
        }
        
        function renderTasks(tasks) {
            const tbody = document.getElementById('taskBody');
            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无任务</td></tr>';
                return;
            }
            
            tbody.innerHTML = tasks.map(t => `
                <tr>
                    <td>${getIcon(t.platform)}</td>
                    <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${t.url}</td>
                    <td>${t.progress.toFixed(1)}%</td>
                    <td><span class="status-badge ${t.status}">${getStatusText(t.status)}</span></td>
                    <td>${new Date(t.created_at).toLocaleString()}</td>
                    <td class="actions">
                        ${t.status === 'downloading' ? '<button class="btn" onclick="cancelTask(\'' + t.id + '\')">停止</button>' : ''}
                        <button class="btn" onclick="deleteTask(\'' + t.id + '\')">删除</button>
                    </td>
                </tr>
            `).join('');
        }
        
        function getIcon(platform) {
            const icons = { bilibili: '📺', youtube: '▶️', douyin: '🎵', weibo: '🌐', ixigua: '🍉', general: '⬇️' };
            return icons[platform] || '📥';
        }
        
        function getStatusText(status) {
            const texts = { pending: '等待中', downloading: '下载中', completed: '已完成', failed: '失败' };
            return texts[status] || status;
        }
        
        async function cancelTask(id) {
            await fetch(`/api/tasks/${id}/cancel`, { method: 'POST' });
            loadTasks();
        }
        
        async function deleteTask(id) {
            if (!confirm('确定删除?')) return;
            await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
            loadTasks();
        }
    </script>
</body>
</html>
