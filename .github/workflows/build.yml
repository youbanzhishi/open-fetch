name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ========== Linux ==========
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      
      - name: Build Linux CLI
        run: cargo build --release --features cli
        env:
          CARGO_INCREMENTAL: 0
      
      - name: Upload Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-linux-cli
          path: target/release/open-fetch
          retention-days: 7
      
      - name: Build Linux All
        run: cargo build --release --features all
        env:
          CARGO_INCREMENTAL: 0
      
      - name: Upload Linux All
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-linux-all
          path: target/release/open-fetch
          retention-days: 7

  # ========== Windows ==========
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      
      - name: Build Windows CLI
        shell: bash
        run: cargo build --release --features cli
        env:
          CARGO_INCREMENTAL: 0
      
      - name: Upload Windows CLI
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-windows-cli
          path: target/release/open-fetch.exe
          retention-days: 7
      
      - name: Build Windows All
        shell: bash
        run: cargo build --release --features all
        env:
          CARGO_INCREMENTAL: 0
      
      - name: Upload Windows All
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-windows-all
          path: target/release/open-fetch.exe
          retention-days: 7

  # ========== macOS ==========
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      
      - name: Build macOS CLI
        run: cargo build --release --features cli
        env:
          CARGO_INCREMENTAL: 0
      
      - name: Upload macOS CLI
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-macos-cli
          path: target/release/open-fetch
          retention-days: 7
      
      - name: Build macOS All
        run: cargo build --release --features all
        env:
          CARGO_INCREMENTAL: 0
      
      - name: Upload macOS All
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-macos-all
          path: target/release/open-fetch
          retention-days: 7

  # ========== 测试 ==========
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      - name: Run tests
        run: cargo test --all-features

  # ========== 打包发布 ==========
  release:
    needs: [build-linux, build-windows, build-macos, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      # 下载所有产物
      - name: Download Linux
        uses: actions/download-artifact@v4
        with: { name: open-fetch-linux-all, path: dist/linux }
      - name: Download Windows
        uses: actions/download-artifact@v4
        with: { name: open-fetch-windows-all, path: dist/windows }
      - name: Download macOS
        uses: actions/download-artifact@v4
        with: { name: open-fetch-macos-all, path: dist/macos }
      
      - name: Set execute permission
        shell: bash
        run: |
          chmod +x dist/linux/open-fetch
          chmod +x dist/macos/open-fetch
          # CLI版本重命名
          mv dist/linux/open-fetch dist/linux/open-fetch-full
          mv dist/macos/open-fetch dist/macos/open-fetch-full
          mv dist/windows/open-fetch.exe dist/windows/open-fetch-full.exe
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/linux/open-fetch-full
            dist/windows/open-fetch-full.exe
            dist/macos/open-fetch-full
            src/web/*.html
          body: |
            ## OpenFetch v${{ github.ref_name }} ☁️
            
            ### 📦 跨平台编译产物
            
            | 平台 | 完整版本(含CLI+GUI+云服务) |
            |------|---------------------------|
            | 🐧 Linux x64 | [open-fetch-full](dist/linux/open-fetch-full) |
            | 🪟 Windows x64 | [open-fetch-full.exe](dist/windows/open-fetch-full.exe) |
            | 🍎 macOS | [open-fetch-full](dist/macos/open-fetch-full) |
            
            ### 🚀 快速开始
            
            **Linux/macOS:**
            ```bash
            chmod +x open-fetch-full
            # CLI下载
            ./open-fetch-full download "https://www.bilibili.com/video/BV1xx..."
            # 启动云端服务
            ./open-fetch-full cloud --port 3000
            # GUI桌面应用
            ./open-fetch-full gui
            ```
            
            **Windows:**
            ```powershell
            # CLI下载
            .\open-fetch-full.exe download "url"
            # 云端服务
            .\open-fetch-full.exe cloud --port 3000
            ```
            
            ### 🌐 Web UI
            
            云端服务启动后访问 http://localhost:3000/
            
            ### 📋 功能特性
            
            - ✅ 命令行下载：支持B站/油管/抖音等全平台
            - ✅ GUI桌面应用：跨平台图形界面
            - ✅ 云端服务：Web UI + RESTful API + WebSocket
            - ✅ 批量下载：支持文件列表批量处理
            - ✅ 视频压缩：内置压缩功能
