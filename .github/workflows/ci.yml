name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source ~/.cargo/env
          rustc --version
          cargo --version
        shell: bash
        
      - name: Build
        run: |
          source ~/.cargo/env
          cargo build --release
        shell: bash
        continue-on-error: true
        
      - name: Check build
        run: |
          ls -la target/release/open-fetch 2>/dev/null && echo "BUILD_SUCCESS" || echo "BUILD_FAILED"
        shell: bash
        
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-linux
          path: target/release/open-fetch
