name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source ~/.cargo/env
          rustc --version
      
      - name: Build
        run: |
          source ~/.cargo/env
          cargo build --release --features all 2>&1 || echo "Build failed"
      
      - name: Check output
        run: |
          source ~/.cargo/env
          ls -la target/release/ 2>/dev/null || echo "No build output"
