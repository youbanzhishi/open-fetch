name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Build
        run: cargo build --release --features all
        
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-binary
          path: target/release/open-fetch
