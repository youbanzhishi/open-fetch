name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          
      - name: Build
        run: |
          $HOME/.cargo/bin/cargo build --release -j 1 2>&1 || echo "BUILD_FAILED"
        continue-on-error: true
        
      - name: Check
        run: |
          if [ -f target/release/open-fetch ]; then
            echo "✅ BUILD SUCCESS"
            ls -lh target/release/open-fetch
          else
            echo "❌ BUILD FAILED"
          fi

  # ============ 跨平台编译 ============
  build-all:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          
      - name: Build
        run: |
          $HOME/.cargo/bin/cargo build --release -j 1 2>&1
        continue-on-error: true
        
      - name: Upload
        if: success()
        run: |
          mkdir -p dist
          cp target/release/open-fetch.exe dist/ 2>/dev/null || \
          cp target/release/open-fetch dist/ 2>/dev/null || true
          ls -la dist/ 2>/dev/null || echo "No artifact"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: open-fetch-${{ matrix.os }}
          path: dist/
          retention-days: 7
