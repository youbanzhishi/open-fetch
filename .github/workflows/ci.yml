name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  # ============ 基础编译测试 ============
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target
        
      - name: Build
        run: |
          echo "=== Rust Version ==="
          rustc --version
          cargo --version
          echo ""
          echo "=== Cargo.toml ==="
          cat Cargo.toml
          echo ""
          echo "=== Building ==="
          cargo build --release 2>&1
          echo ""
          echo "=== Build result ==="
          if [ -f target/release/open-fetch ]; then
            echo "SUCCESS: Binary found"
            ls -lh target/release/open-fetch
          else
            echo "FAILED: Binary not found"
            exit 1
          fi
