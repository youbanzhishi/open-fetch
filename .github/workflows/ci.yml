name: Build & Release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============ 跨平台桌面版编译 ============
  build-desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: open-fetch-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: open-fetch-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: open-fetch-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@master
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI (cli feature)
        run: cargo build --release --features cli --target ${{ matrix.target }}

      - name: Build All Features
        run: cargo build --release --features all --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/open-fetch dist/${{ matrix.artifact }}/
          # 包含README
          cp README.md LICENSE dist/${{ matrix.artifact }}/ 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 7

  # ============ Web/Cloud 服务版编译 ============
  build-cloud:
    name: Cloud Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build Cloud (server + cloud features)
        run: cargo build --release --features cloud --target x86_64-unknown-linux-musl

      - name: Build All Features (static)
        run: cargo build --release --features all --target x86_64-unknown-linux-musl

      - name: Package Web Assets
        run: |
          mkdir -p dist/open-fetch-cloud
          cp target/x86_64-unknown-linux-musl/release/open-fetch dist/open-fetch-cloud/
          # 复制Web UI
          cp -r src/web dist/open-fetch-cloud/ 2>/dev/null || true
          # 创建启动脚本
          cat > dist/open-fetch-cloud/start.sh << 'EOF'
          #!/bin/bash
          ./open-fetch cloud --port 3000 --host 0.0.0.0
          EOF
          chmod +x dist/open-fetch-cloud/start.sh

      - name: Upload Cloud Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-cloud
          path: dist/open-fetch-cloud
          retention-days: 30

  # ============ 发布 Release ============
  release:
    name: Create Release
    needs: [build-desktop, build-cloud]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            tar -czvf "release/${name}.tar.gz" -C "$dir" .
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============ 验证构建成功 ============
  verify:
    name: Verify Build
    needs: [build-desktop, build-cloud]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Build Artifacts ==="
          find artifacts -type f -name "open-fetch*" -o -name "*.exe" | head -20
          echo "=== Build Summary ==="
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            size=$(du -sh "$dir" | cut -f1)
            echo "$name: $size"
          done
