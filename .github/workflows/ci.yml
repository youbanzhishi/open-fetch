name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  # ============ 基础编译测试 ============
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target
        
      - name: Show Cargo.toml
        run: |
          echo "=== Cargo.toml ==="
          cat Cargo.toml
          echo ""
          echo "=== src/main.rs ==="
          head -20 src/main.rs
          echo ""
          echo "=== src/ structure ==="
          find src/ -type f
          
      - name: Build
        run: |
          echo "=== Building ==="
          cargo build --release 2>&1
          echo ""
          echo "=== Check target/release ==="
          ls -la target/release/ 2>/dev/null || echo "No target/release directory"
          echo ""
          echo "=== Check for binary ==="
          find target/ -name "open-fetch*" -type f 2>/dev/null || echo "No binary found"
          echo ""
          echo "=== Cargo.lock check ==="
          if [ -f Cargo.lock ]; then
            echo "Cargo.lock exists"
          else
            echo "WARNING: Cargo.lock not found - dependencies may not be locked"
          fi
          
      - name: Check
        run: |
          echo "=== Final Check ==="
          if [ -f target/release/open-fetch ]; then
            echo "✅ BUILD SUCCESS"
            ls -lh target/release/open-fetch
          else
            echo "❌ BUILD FAILED - binary not found"
            # Try cargo build again with verbose
            cargo build --release -vv 2>&1 | tail -50
            exit 1
          fi
