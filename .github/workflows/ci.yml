name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source ~/.cargo/env
          rustc --version
          cargo --version
      
      - name: Build
        run: |
          source ~/.cargo/env
          cargo build --release --features all
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-linux
          path: target/release/open-fetch
          retention-days: 3
