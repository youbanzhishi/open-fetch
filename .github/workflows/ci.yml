name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  # ============ 基础编译测试 ============
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target
        
      - name: Build
        run: |
          cargo build --release 2>&1
        continue-on-error: true
          
      - name: Check
        run: |
          if [ -f target/release/open-fetch ]; then
            echo "✅ BUILD SUCCESS"
            ls -lh target/release/open-fetch
          else
            echo "❌ BUILD FAILED"
            # Show cargo output
            cat ~/.cargo/.rustup/toolchains/*/lib/rustlib/src/rustc/ \
              Cargo.lock target/.cargo-lock.json 2>/dev/null || true
            exit 1
          fi

  # ============ 跨平台编译 ============
  build-all:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target
      
      - name: Build
        run: |
          cargo build --release 2>&1
        continue-on-error: true
          
      - name: Package
        run: |
          mkdir -p dist
          # Windows .exe
          if [ -f target/release/open-fetch.exe ]; then
            cp target/release/open-fetch.exe dist/
          fi
          # Unix binary
          if [ -f target/release/open-fetch ]; then
            cp target/release/open-fetch dist/
          fi
          ls -la dist/ || echo "No artifact"
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: open-fetch-${{ matrix.os }}
          path: dist/
          retention-days: 7
