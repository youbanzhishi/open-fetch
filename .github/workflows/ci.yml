name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  # ============ 基础编译测试 ============
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target
        
      - name: Build
        run: |
          echo "=== Rust Version ==="
          rustc --version
          cargo --version
          echo ""
          echo "=== Cargo.toml ==="
          cat Cargo.toml
          echo ""
          echo "=== Building ===" | tee build.log
          cargo build --release 2>&1 | tee -a build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "" | tee -a build.log
          echo "=== Cargo build exit code: $BUILD_EXIT ===" | tee -a build.log
          echo "" | tee -a build.log
          echo "=== target/release contents ===" | tee -a build.log
          ls -la target/release/ 2>&1 | tee -a build.log || echo "No target/release" | tee -a build.log
          echo "" | tee -a build.log
          echo "=== Find all binaries ===" | tee -a build.log
          find target/ -name "open-fetch*" -type f 2>&1 | tee -a build.log || echo "No binary found" | tee -a build.log
          exit $BUILD_EXIT
          
      - name: Upload log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 1
