name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============ 跨平台编译 ============
  build-all:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target
      
      - name: Build
        run: |
          cargo build --release
          
      - name: Package
        run: |
          mkdir -p dist
          # Windows .exe
          if [ -f target/release/open-fetch.exe ]; then
            cp target/release/open-fetch.exe dist/
          fi
          # Unix binary
          if [ -f target/release/open-fetch ]; then
            cp target/release/open-fetch dist/
          fi
          echo "=== Artifacts ==="
          ls -lh dist/
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-${{ matrix.os }}
          path: dist/
          retention-days: 7
