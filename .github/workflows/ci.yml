name: Build & Release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============ 基础CLI编译测试 ============
  build-cli:
    name: Build CLI (Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source $HOME/.cargo/env
          rustc --version
          cargo --version

      - name: Build CLI
        run: |
          source $HOME/.cargo/env
          cargo build --release --features cli 2>&1
        continue-on-error: true
        
      - name: Check Result
        run: |
          source $HOME/.cargo/env
          if [ -f target/release/open-fetch ]; then
            echo "✅ CLI BUILD SUCCESS"
            ls -lh target/release/open-fetch
          else
            echo "❌ CLI BUILD FAILED"
            cat target/release/.cargo-lock 2>/dev/null || true
          fi

  # ============ 跨平台桌面版编译 ============
  build-desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: open-fetch-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: open-fetch-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: open-fetch-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source $HOME/.cargo/env
          rustc --version

      - name: Add target
        if: matrix.target != ''
        run: |
          source $HOME/.cargo/env
          rustup target add ${{ matrix.target }}

      - name: Build All Features
        run: |
          source $HOME/.cargo/env
          cargo build --release --features all --target ${{ matrix.target }} 2>&1
        continue-on-error: true

      - name: Package
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          if [ -f target/${{ matrix.target }}/release/open-fetch.exe ]; then
            cp target/${{ matrix.target }}/release/open-fetch.exe dist/${{ matrix.artifact }}/
          elif [ -f target/${{ matrix.target }}/release/open-fetch ]; then
            cp target/${{ matrix.target }}/release/open-fetch dist/${{ matrix.artifact }}/
          elif [ -f target/release/open-fetch ]; then
            cp target/release/open-fetch dist/${{ matrix.artifact }}/
          fi
          ls -la dist/${{ matrix.artifact }}/ 2>/dev/null || echo "No artifact"

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 7

  # ============ Web/Cloud 服务版编译 ============
  build-cloud:
    name: Cloud Service
    runs-on: ubuntu-latest
    needs: build-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source $HOME/.cargo/env

      - name: Build Cloud
        run: |
          source $HOME/.cargo/env
          cargo build --release --features cloud 2>&1
        continue-on-error: true

      - name: Package
        run: |
          mkdir -p dist/open-fetch-cloud
          cp target/release/open-fetch dist/open-fetch-cloud/ 2>/dev/null || true
          cp -r src/web dist/open-fetch-cloud/ 2>/dev/null || true
          ls -la dist/open-fetch-cloud/

      - name: Upload Cloud Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-cloud
          path: dist/open-fetch-cloud
          retention-days: 30

  # ============ 发布 Release ============
  release:
    name: Create Release
    needs: [build-desktop, build-cloud]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            tar -czvf "release/${name}.tar.gz" -C "$dir" . 2>/dev/null || \
            cp -r "$dir" "release/${name}" 2>/dev/null || true
          done
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============ 验证构建成功 ============
  verify:
    name: Verify Build
    needs: [build-desktop, build-cloud]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Build Artifacts ==="
          find artifacts -type f \( -name "open-fetch*" -o -name "*.exe" \) | head -20
          echo ""
          echo "=== Build Summary ==="
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            size=$(du -sh "$dir" 2>/dev/null | cut -f1 || echo "N/A")
            echo "$name: $size"
          done
