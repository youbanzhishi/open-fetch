name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============ 基础编译测试 ============
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions/setup-rust@v1
        with:
          rust stable
          components: rustfmt, clippy
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target
        
      - name: Build
        run: |
          cargo build --release -j 1 2>&1
          
      - name: Check
        run: |
          if [ -f target/release/open-fetch ]; then
            echo "✅ BUILD SUCCESS"
            ls -lh target/release/open-fetch
          else
            echo "❌ BUILD FAILED"
            exit 1
          fi

  # ============ 跨平台编译 ============
  build-all:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions/setup-rust@v1
        with:
          rust: stable
          components: rustfmt, clippy
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target
      
      - name: Build
        run: |
          cargo build --release -j 1
        env:
          CARGO_INCREMENTAL: 0
          
      - name: Package
        run: |
          mkdir -p dist
          # Windows .exe
          if [ -f target/release/open-fetch.exe ]; then
            cp target/release/open-fetch.exe dist/
          fi
          # Unix binary
          if [ -f target/release/open-fetch ]; then
            cp target/release/open-fetch dist/
          fi
          ls -la dist/ || echo "No artifact"
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-${{ matrix.os }}
          path: dist/
          retention-days: 7
