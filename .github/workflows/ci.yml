name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          
      - name: Build
        run: |
          $HOME/.cargo/bin/cargo build --release
        continue-on-error: true
        
      - name: Check
        run: |
          ls -la target/release/open-fetch 2>/dev/null && echo "BUILD_SUCCESS" || echo "BUILD_FAILED: $(cat target/release/.cargo-lock 2>/dev/null | head -5)"
