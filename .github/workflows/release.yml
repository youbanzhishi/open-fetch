name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source ~/.cargo/env
          rustc --version
          cargo --version
      - name: Build
        run: |
          source ~/.cargo/env
          cargo build --release --features all
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-fetch-linux
          path: target/release/open-fetch
          retention-days: 30
      - name: Upload Web UI
        uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: src/web/*.html
          retention-days: 30
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: open-fetch-linux
          path: dist
      - name: Download Web UI
        uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: dist
      - name: Set execute
        run: chmod +x dist/open-fetch
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/open-fetch
            dist/*.html
          body: |
            ## OpenFetch ${{ github.ref_name }}
            
            ### 📦 Linux编译产物
            - `open-fetch` - 可执行文件（含CLI+GUI+云服务）
            
            ### 🌐 Web UI文件
            - `index.html` - 主界面
            - `tasks.html` - 任务列表
            - `settings.html` - 设置页面
            
            ### 使用方式
            ```bash
            chmod +x open-fetch
            # 启动云端服务
            ./open-fetch cloud --port 3000
            ```
