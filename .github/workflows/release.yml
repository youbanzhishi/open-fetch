name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source ~/.cargo/env
      - name: Build
        run: |
          source ~/.cargo/env
          cargo build --release --features all
          mv target/release/open-fetch "open-fetch-linux"
      - uses: actions/upload-artifact@v4
        with:
          name: open-fetch-linux
          path: open-fetch-linux

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          Invoke-Expression (Invoke-WebRequest -Uri https://sh.rustup.rs -UseBasicParsing).Content | Out-String -Stream | Where-Object { $_ -notmatch "^\s*$" } | ForEach-Object { if ($_ -match "continue|press ENTER") {} else { Invoke-Expression $_ } }
      - name: Build
        shell: bash
        run: |
          source ~/.cargo/env
          cargo build --release --features all
          mv target/release/open-fetch.exe "open-fetch-windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: open-fetch-windows
          path: open-fetch-windows.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source ~/.cargo/env
      - name: Build
        run: |
          source ~/.cargo/env
          cargo build --release --features all
          mv target/release/open-fetch "openfetch-macos"
      - uses: actions/upload-artifact@v4
        with:
          name: open-fetch-macos
          path: openfetch-macos

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Prepare files
        shell: bash
        run: |
          chmod +x dist/open-fetch-linux
          chmod +x dist/openfetch-macos
          mv dist/openfetch-macos dist/open-fetch-macos
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/open-fetch-linux
            dist/open-fetch-windows.exe
            dist/open-fetch-macos
            src/web/*.html
          body: |
            ## OpenFetch ${{ github.ref_name }}
            
            ### 📦 跨平台编译产物
            
            | 平台 | 下载 |
            |------|------|
            | 🐧 Linux | [open-fetch-linux](dist/open-fetch-linux) |
            | 🪟 Windows | [open-fetch-windows.exe](dist/open-fetch-windows.exe) |
            | 🍎 macOS | [open-fetch-macos](dist/open-fetch-macos) |
            
            ### 🌐 Web UI
            包含 index.html, tasks.html, settings.html
            
            ### 使用方式
            ```bash
            chmod +x open-fetch-linux
            ./open-fetch-linux cloud --port 3000
            ```
