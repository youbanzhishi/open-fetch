[package]
name = "open-fetch"
version = "0.9.2"
edition = "2021"
authors = ["youbanzhishi"]
description = "OpenFetch - 开源全能下载器 (支持B站/油管/抖音等全平台)"
license = "MIT"
repository = "https://github.com/youbanzhishi/open-fetch"
keywords = ["downloader", "video", "bilibili", "youtube", "download"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Cloud/Server (可选)
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "fs"], optional = true }
futures-util = { version = "0.3", optional = true }
thiserror = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["cli"]
cli = []
cloud = ["axum", "tokio", "tower", "tower-http", "futures-util", "thiserror", "tracing-subscriber"]

[[bin]]
name = "open-fetch"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
