[package]
name = "open-fetch"
version = "0.9.0"
edition = "2021"
authors = ["youbanzhishi"]
description = "OpenFetch - 开源全能下载器 (支持B站/油管/抖音等全平台)"
license = "MIT"
repository = "https://github.com/youbanzhishi/open-fetch"
keywords = ["downloader", "video", "bilibili", "youtube", "download"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "5"
dirs = "5"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "open-fetch"
path = "src/main.rs"
