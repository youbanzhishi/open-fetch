<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OpenFetch</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --bg: #1e1e2e;
            --bg-light: #2a2a3e;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
        }
        
        body {
            width: 100%;
            max-width: 360px;
            min-height: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            padding: 16px;
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .title { font-size: 20px; font-weight: 600; }
        .subtitle { font-size: 12px; opacity: 0.8; }
        
        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--bg-light);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            margin-right: 6px;
        }
        
        .status-dot.online { background: var(--success); }
        
        .card {
            background: var(--bg-light);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }
        
        .card-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
        }
        
        .info-label { color: var(--text-muted); }
        .info-value { font-weight: 500; }
        
        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--primary);
            border-radius: 4px;
            font-size: 11px;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-secondary {
            background: var(--bg-light);
            color: var(--text);
            border: 1px solid #3f3f5a;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .empty {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
        }
        
        .empty-icon { font-size: 32px; margin-bottom: 8px; }
        
        .footer {
            text-align: center;
            padding: 12px;
            color: var(--text-muted);
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">⬇</div>
        <div>
            <div class="title">OpenFetch</div>
            <div class="subtitle">全能下载助手</div>
        </div>
    </div>
    
    <div class="status">
        <div style="display:flex;align-items:center;">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">检查中...</span>
        </div>
        <span id="queueCount">队列: 0</span>
    </div>
    
    <div class="card">
        <div class="card-title">当前页面</div>
        <div id="pageInfo">
            <div class="empty">
                <div class="empty-icon">🔍</div>
                <div>正在检测...</div>
            </div>
        </div>
    </div>
    
    <button class="btn btn-primary" id="downloadBtn" disabled>
        ⬇ 添加到下载
    </button>
    
    <button class="btn btn-secondary" id="settingsBtn">
        ⚙ 设置
    </button>
    
    <div class="card" id="queueCard">
        <div class="card-title">下载队列</div>
        <div id="queueList">
            <div class="empty">暂无下载任务</div>
        </div>
    </div>
    
    <div class="footer">v0.5.0 · Safari Extension</div>
    
    <script src="popup.js"></script>
</body>
</html>
