<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenFetch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 360px;
            min-height: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }
        
        .header {
            padding: 16px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo img {
            width: 32px;
            height: 32px;
        }
        
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status {
            font-size: 12px;
            margin-top: 6px;
            color: #888;
        }
        
        .status.connected { color: #4ade80; }
        .status.disconnected { color: #f87171; }
        
        .content {
            padding: 16px;
        }
        
        .platform-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .platform-card.detected {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,0.2);
        }
        
        .platform-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .platform-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        
        .video-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .quality-options {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .quality-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: transparent;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .quality-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .quality-btn.selected {
            background: linear-gradient(135deg, #7c3aed, #00d4ff);
            border-color: transparent;
        }
        
        .download-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
        }
        
        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
        }
        
        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #888;
            font-size: 13px;
            cursor: pointer;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff;
        }
        
        .extensions-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .extension-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        .extension-name {
            font-size: 13px;
        }
        
        .extension-status {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #4ade80;
            color: #000;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100px;
            color: #888;
        }
        
        .loading::after {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid #7c3aed;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .no-media {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }
        
        .no-media-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <span style="font-size: 28px;">⬇️</span>
            <span class="logo-text">OpenFetch</span>
        </div>
        <div class="status" id="status">检查连接...</div>
    </div>
    
    <div class="content">
        <div class="tabs">
            <button class="tab active" data-tab="download">下载</button>
            <button class="tab" data-tab="extensions">扩展</button>
            <button class="tab" data-tab="history">历史</button>
        </div>
        
        <div id="download-panel">
            <div id="media-info">
                <div class="loading">检测中</div>
            </div>
        </div>
        
        <div id="extensions-panel" style="display:none;">
            <div class="extensions-list" id="extensions-list">
                <div class="loading">加载中</div>
            </div>
        </div>
        
        <div id="history-panel" style="display:none;">
            <div id="history-list"></div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
